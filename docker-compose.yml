services:
  postgres:
    image: ankane/pgvector
    container_name: github-issue-postgres
    environment:
      POSTGRES_DB: issues
      POSTGRES_USER: user 
      POSTGRES_PASSWORD: pass 
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: github_issue_neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4j123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: